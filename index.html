<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Reverse Dungeon</title>
<meta name="description" content="A dungeon-builder where you play the dungeon. Heroes learn your traps and tell the guild, so you rebuild between raids.">
<meta name="theme-color" content="#0d0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0b10'/%3E%3Cpath d='M6 28V12a10 10 0 0 1 20 0v16' fill='none' stroke='%23c43c68' stroke-width='3'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23e3b04b'/%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>The Reverse Dungeon</h1>
    <p>You are the dungeon. They are taking notes.</p>
  </div>
  <dl class="stats">
    <div><dt>Raid</dt><dd id="st-raid">1</dd></div>
    <div class="gold"><dt>Hoard</dt><dd id="st-gold">100</dd></div>
    <div class="malice"><dt>Malice</dt><dd id="st-malice">0</dd></div>
    <div class="steel"><dt>Guild map</dt><dd id="st-known">0%</dd></div>
  </dl>
  <button type="button" class="ghost menu" id="menu">New dungeon</button>
</header>

<main class="layout">
  <aside class="panel blueprints" id="blueprints" aria-label="Blueprints">
    <h2>Blueprints</h2>
    <div class="tools" id="tools"></div>
    <h3>Always in stock</h3>
    <div class="cards" id="basic"></div>
    <h3>Tonight’s offers</h3>
    <div class="cards" id="offers"></div>
    <div class="detail" id="detail" aria-live="polite"></div>
  </aside>

  <section class="stage">
    <div class="stagebar">
      <div class="omen" id="omen"></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Map view">
          <button type="button" id="view-truth" class="on" aria-pressed="true">Your dungeon</button>
          <button type="button" id="view-guild" aria-pressed="false">Guild’s map <kbd>G</kbd></button>
        </div>
      </div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <canvas id="board" aria-label="The dungeon map"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <div class="actionbar" id="actionbar">
      <div class="build-actions" id="build-actions">
        <p class="hint" id="hint">Pick a blueprint, then click the map.</p>
        <button type="button" class="go" id="go">Open the gate <kbd>Space</kbd></button>
      </div>
      <div class="raid-actions" id="raid-actions" hidden>
        <div class="powers" id="powers"></div>
        <div class="seg speed" role="group" aria-label="Speed">
          <button type="button" data-speed="0" id="pause">Pause</button>
          <button type="button" data-speed="1" class="on">1×</button>
          <button type="button" data-speed="2">2×</button>
          <button type="button" data-speed="4">4×</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel ledger" aria-label="The Guild Ledger">
    <h2>The Guild Ledger</h2>
    <section>
      <h3 id="party-h">Coming tonight</h3>
      <p class="adapt" id="adapt"></p>
      <ul class="party" id="party"></ul>
    </section>
    <section>
      <h3>Tavern talk</h3>
      <ul class="rumors" id="rumors"></ul>
    </section>
    <section>
      <h3>Raid log</h3>
      <ol class="log" id="log"></ol>
    </section>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<script src="js/data.js?v=6"></script>
<script src="js/world.js?v=6"></script>
<script src="js/sim.js?v=6"></script>
<script src="js/render.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
</body>
</html>
